<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dapur Nusa: Rush Hour Kitchen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b110b; }
  #game {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    background: #1b110b; touch-action: none; cursor: crosshair;
    image-rendering: auto;
  }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Dapur Nusa: Rush Hour Kitchen. Walk the kitchen with WASD or the arrow keys, take ingredients from the crates, chop and cook them, plate a dish and serve it at the window before its order expires."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
